global_planner:
  plugin: hybrid_astar
  map_file: maps/debug/map.yaml
  planning_timeout_ms: 12000
  corridor_margin_m: 0.20
  footprint_radius_m: 0.45
  clearance_m: 0.20
  grid_inflation_radius_m: 0.30
  grid_search_padding_m: 3.00
  grid_simplify_path: true
  min_turning_radius_m: 0.81
  max_speed_mps: 1.80
  fallback_plugin: none
  path_sample_spacing_m: 0.10
  hybrid_step_length_m: 0.20
  hybrid_curvature_bins: 9
  hybrid_heading_bins: 72
  hybrid_goal_position_tolerance_m: 0.15
  hybrid_goal_heading_tolerance_deg: 8.0
  hybrid_max_expansions: 250000

trajectory_smoother:
  enabled: false
  plugin: none
  sample_spacing_m: 0.20
  tangent_scale: 0.75

semantic_route_graph:
  lane_centerline_topic: /semantic_map
  corridor_topic: /planning/corridor
  keepout_enabled: true

replanning:
  enabled: true
  plugin: reference_aware_hybrid_astar
  frequency_hz: 1.0
  lookahead_distance_m: 3.0
  reference_deviation_weight: 2.0
  inflation_radius_m: 0.45
  search_padding_m: 1.5
  goal_position_tolerance_m: 0.25
  goal_heading_tolerance_deg: 15.0
  max_expansions: 250000
  reference_search_window_points: 120
  costmap_topic: /avoidance/local_costmap
  local_trajectory_topic: /planning/local_trajectory
  status_topic: /planning/local_replan_status
  max_costmap_age_s: 4.0
  local_trajectory_timeout_s: 4.0
  max_retries: 1
  failure_action: SAFE_HOLD
