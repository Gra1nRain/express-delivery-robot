profile: debug
default_dock_side: RIGHT
position_tolerance_m: 0.10
yaw_tolerance_deg: 5.0
stable_time_s: 1.0
max_speed_mps: 0.20
min_speed_mps: 0.05
max_retries: 2
arm_max_retries: 3
# The front stop calibrates the vehicle against each shelf.  The immediately
# following rear stop reuses that pose and drives the semantic-point separation
# as one straight segment; it does not fit the shelf again.
straight_followups:
  pickup_rear: pickup_front
  drop_rear: drop_front
precision_profiles:
  shelf_dock:
    # Enter before ordinary inflated-costmap rejection can block the exact pose.
    activation_distance_m: 1.50
    trim_entry_distance_m: 0.10
    final_position_tolerance_m: 0.03
    heading_realign_tolerance_deg: 4.0
    heading_trim_target_deg: 2.0
    settle_time_s: 0.30
    stable_time_s: 0.50
    stopped_speed_tolerance_mps: 0.02
    stopped_yaw_rate_tolerance_radps: 0.03
    max_spin_correction_deg: 10.0
    max_parallel_correction_m: 0.35
    spin_gain: 1.0
    spin_min_yaw_rate_radps: 0.06
    spin_max_yaw_rate_radps: 0.15
    parallel_gain: 0.8
    parallel_min_speed_mps: 0.04
    parallel_max_speed_mps: 0.06
    # Final 0.20 m is referenced to the observed shelf, not the map lateral pose.
    # Ranger width is 0.50 m: 0.25 m half-width + 0.28 m clearance = 0.53 m
    # target sensor-to-shelf distance in the body-frame scan.
    shelf_relative:
      enabled: true
      side: RIGHT
      vehicle_half_width_m: 0.25
      target_side_clearance_m: 0.28
      minimum_side_clearance_m: 0.20
      capture_distance_m: 0.20
      observation_max_age_s: 0.30
      # Only the stopped final-docking observer fuses this short window. The
      # obstacle layer and global /scan consumers remain latest-frame-only.
      scan_fusion_window_s: 0.80
      scan_fusion_max_frames: 10
      scan_fit:
        min_range_m: 0.10
        max_range_m: 1.50
        min_longitudinal_m: -0.60
        max_longitudinal_m: 0.80
        min_side_distance_m: 0.20
        max_side_distance_m: 0.80
        min_points: 6
        min_span_m: 0.30
        max_residual_m: 0.035
        max_heading_error_deg: 15.0
        max_candidate_points: 40
