trajectory_tracker:
  plugin: mppi
  frequency_hz: 20.0
  max_lateral_error_m: 0.15
  max_heading_error_deg: 20.0
  fallback_plugin: none
  diagnostic_reference_tracker: regulated_pure_pursuit_not_implemented
  mppi:
    horizon_steps: 30
    rollout_count: 384
    iterations: 2
    temperature: 0.35
    speed_noise_std_mps: 0.05
    curvature_noise_std_1pm: 0.15
    progress_search_window_points: 40
    max_progress_advance_points: 3
    lateral_feedback_gain_1pm_per_m: 1.5
    heading_feedback_gain_1pm_per_rad: 1.0
    feedback_blend: 0.35
    # Do not cold-start MPPI for the same 1 Hz RELAXED_HOLD geometry.
    local_plan_reuse_position_tolerance_m: 0.05
    local_plan_reuse_heading_tolerance_deg: 5.0

motion:
  vehicle_model: ranger_mini_v3_hybrid_4ws
  normal_tracking_mode: dual_ackermann
  spin_recovery_enabled: false
  wheelbase_m: 0.494
  track_width_m: 0.364
  # Runtime local/control model; global frozen-route planning remains at 0.81 m.
  min_turning_radius_m: 0.60
  ranger_driver_min_turn_radius_m: 0.47644
  max_inner_steering_angle_rad: 0.698
  protocol_max_speed_mps: 2.00
  protocol_turning_speed_mps: 0.70
  max_speed_mps: 0.15
  cruise_speed_mps: 0.20
  turn_speed_mps: 0.15
  max_acceleration_mps2: 0.20
  max_deceleration_mps2: 0.30
  max_curvature_rate_1pmps: 0.80
  docking_speed_min_mps: 0.05
  docking_speed_max_mps: 0.20

state_estimator:
  pose_source: fast_lio_anchored_map_to_body
  velocity_source: ranger_odom
  map_frame: map
  base_frame: body
  pose_timeout_s: 0.20
  velocity_timeout_s: 0.20
  max_pose_prediction_s: 3.00
  max_position_jump_m: 0.25
  max_heading_jump_deg: 20.0
  initial_pose_settle_s: 0.50

chassis:
  command_topic: /cmd_vel_safe
  driver_topic: /cmd_vel
  wheel_command_enabled: false
  lateral_motion_enabled: false

visualization:
  reference_path_topic: /planning/optimized_trajectory
  local_trajectory_topic: /planning/local_trajectory
  executed_path_topic: /control/executed_path
  executed_path_min_separation_m: 0.05
  executed_path_max_points: 2000
