route_name: debug_indoor_one_lap_route
profile: debug
warning: Indoor one-lap stop-accuracy test without arm or vision feedback.
semantic_map_file: maps/debug/semantic_map.yaml
steps:
  - id: go_traffic_light_1
    type: RUN_SEGMENT
    traffic_light_guard: false
    corridor_ref: go_to_pickup
    target_ref: traffic_light_stop_line
  - id: random_obstacle_1
    type: RUN_SEGMENT
    avoidance_required: false
    corridor_ref: go_to_pickup
    target_ref: pickup_front
  - id: pickup_1_dock
    type: DOCK
    dock_type: PICKUP
    cycle_index: 1
    dock_pose_ref: pickup_front
  - id: pickup_1_rear
    type: RUN_SEGMENT
    corridor_ref: pickup_front_to_rear
    target_ref: pickup_rear
  - id: pickup_1_rear_dock
    type: DOCK
    dock_type: PICKUP
    cycle_index: 1
    dock_pose_ref: pickup_rear
  - id: cone_lane_change_1
    type: CONE_LANE_CHANGE
    corridor_ref: pickup_to_drop
    entry_ref: cone_lane_change_entry
    exit_ref: cone_lane_change_exit
  - id: drop_1_dock
    type: DOCK
    dock_type: DROP
    cycle_index: 1
    dock_pose_ref: drop_front
  - id: drop_1_rear
    type: RUN_SEGMENT
    corridor_ref: drop_front_to_rear
    target_ref: drop_rear
  - id: drop_1_rear_dock
    type: DOCK
    dock_type: DROP
    cycle_index: 1
    dock_pose_ref: drop_rear
  - id: finish_park
    type: FINISH_PARK
    corridor_ref: finish_return
    target_ref: finish_park
