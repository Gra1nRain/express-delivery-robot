route_name: debug_indoor_one_lap_route
profile: debug
warning: Indoor one-lap continuous checkpoint route without arm or vision feedback.
semantic_map_file: maps/debug/semantic_map.yaml
continuous_planning_mode: joined_step_paths
mission_checkpoints:
  - pickup_front
  - pickup_rear
  - drop_front
  - drop_rear
  - finish_park
# Only semantic assignments live in the route. Geometry and tuning are selected
# from config/docking/debug_dock_params.yaml so a field swap needs no code edit.
precision_docking:
  checkpoints:
    pickup_front: shelf_dock
    pickup_rear: shelf_dock
    drop_front: shelf_dock
    drop_rear: shelf_dock
steps:
  - id: pickup_transit_1
    type: RUN_SEGMENT
    traffic_light_guard: false
    avoidance_required: true
    docking_approach: true
    soft_intermediate_refs: true
    corridor_ref: go_to_pickup_aligned
    target_ref: pickup_front
  - id: pickup_1_dock
    type: DOCK
    dock_type: PICKUP
    cycle_index: 1
    dock_pose_ref: pickup_front
  - id: pickup_1_rear
    type: RUN_SEGMENT
    docking_approach: true
    corridor_ref: pickup_front_to_rear
    target_ref: pickup_rear
  - id: pickup_1_rear_dock
    type: DOCK
    dock_type: PICKUP
    cycle_index: 1
    dock_pose_ref: pickup_rear
  # One continuous global interval covers pickup departure, the complete
  # U-turn and the drop precision approach. Intermediate semantic refs are soft
  # guides. The shelf-clear terminal anchor is exact so the rear of the vehicle
  # clears the shelf before steering; historical cone refs do not constrain it.
  - id: drop_transit_1
    type: RUN_SEGMENT
    docking_approach: false
    precision_goal_connection: true
    soft_intermediate_refs: true
    corridor_ref: pickup_to_drop_aligned
    target_ref: drop_front
  - id: drop_1_dock
    type: DOCK
    dock_type: DROP
    cycle_index: 1
    dock_pose_ref: drop_front
  - id: drop_1_rear
    type: RUN_SEGMENT
    docking_approach: true
    corridor_ref: drop_front_to_rear
    target_ref: drop_rear
  - id: drop_1_rear_dock
    type: DOCK
    dock_type: DROP
    cycle_index: 1
    dock_pose_ref: drop_rear
  - id: finish_park
    type: FINISH_PARK
    corridor_ref: finish_return
    target_ref: finish_park
