wrist_traffic_perception:
  ros__parameters:
    image_topic: /left_wrist_camera/camera/color/image_raw
    stop_request_topic: /perception/traffic_stop_request
    flag_event_topic: /perception/flag_wave_detected
    flag_reset_topic: /perception/flag_reset
    light_detection_topic: /perception/traffic_light_detection
    light_active_topic: /perception/traffic_light_active
    light_confirm_frames: 3
    camera_timeout_s: 1.0
    flag_saturation_threshold: 100
    flag_value_threshold: 100
    flag_min_area_px: 800.0
    flag_border_margin_px: 8
    flag_trajectory_window: 20
    flag_min_motion_px: 30.0
    flag_cooldown_s: 2.0
    flag_max_lost_frames: 8

traffic_light_recognition:
  ros__parameters:
    image_topic: /left_wrist_camera/camera/color/image_raw
    enable_topic: /perception/traffic_light_enable
    detection_topic: /perception/traffic_light_detection
    active_topic: /perception/traffic_light_active
    confidence: 0.30
    device: cpu
    inference_image_size: 320
    inference_period_s: 0.50
