startup_alignment:
  ros__parameters:
    status_topic: /localization/alignment_status
    anchor_status_topic: /localization/anchor_status
    anchor_update_request_topic: /localization/anchor_update_request
    residual_topic: /localization/scan_map_residual
    route_enable_topic: /mission/route_enable
    checkpoint_request_topic: /localization/checkpoint_alignment_request
    required_samples: 5
    verification_samples: 3
    max_sample_translation_spread_m: 0.05
    max_sample_yaw_spread_deg: 1.0
    min_inlier_ratio: 0.60
    max_best_median_residual_m: 0.05
    # If the coarse anchor already aligns most scan points to the map, keep it
    # instead of accepting a large correction along repeated wall geometry.
    max_acceptable_baseline_median_m: 0.08
    min_acceptable_baseline_inlier_ratio: 0.50
    max_startup_translation_m: 0.50
    max_startup_yaw_deg: 10.0
    max_checkpoint_translation_m: 0.20
    max_checkpoint_yaw_deg: 5.0
    verification_translation_m: 0.03
    verification_yaw_deg: 0.75
