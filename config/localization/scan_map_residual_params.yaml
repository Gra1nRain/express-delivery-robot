scan_map_residual_monitor:
  ros__parameters:
    map_frame: map
    map_topic: /map
    scan_topic: /scan
    vehicle_odom_topic: /odom
    fastlio_odom_topic: /Odometry
    status_topic: /localization/scan_map_residual
    update_rate_hz: 0.5
    max_scan_age_s: 0.5
    max_scan_points: 360
    # The recorded MID-360 projection typically contains 32-59 usable points.
    min_points: 30
    translation_window_m: 0.40
    translation_step_m: 0.05
    yaw_window_deg: 10.0
    yaw_step_deg: 1.0
    fine_translation_window_m: 0.05
    fine_translation_step_m: 0.01
    fine_yaw_window_deg: 1.0
    fine_yaw_step_deg: 0.25
    max_residual_m: 0.50
    inlier_threshold_m: 0.10
    stationary_linear_speed_mps: 0.01
    stationary_yaw_rate_radps: 0.01
    max_vehicle_odom_age_s: 0.5
    stationary_min_duration_s: 1.0
