safety:
  command_output_topic: /cmd_vel_safe
  command_timeout_s: 0.15
  state_timeout_s: 0.15
  system_state_timeout_s: 0.20
  max_speed_mps: 0.20
  max_acceleration_mps2: 0.20
  max_deceleration_mps2: 0.30
  min_turning_radius_m: 0.81
  max_lateral_error_m: 0.15
  max_heading_error_deg: 20.0
  require_can_control_mode: true
  require_system_state: true
  require_dual_ackermann_mode: true
  avoidance_stop_topic: /avoidance/stop_request
  require_avoidance_source: true
  avoidance_timeout_s: 0.35
  on_fault: SAFE_HOLD

proximity_stop:
  cloud_topic: /cloud_registered_body
  stop_request_topic: /avoidance/stop_request
  status_topic: /avoidance/proximity_status
  expected_frame_id: body
  max_cloud_age_s: 0.50
  x_min_m: 0.25
  stop_distance_m: 0.85
  front_half_angle_rad: 0.4363
  lateral_half_width_m: 0.45
  z_min_m: -0.25
  z_max_m: 0.80
  min_points: 3
