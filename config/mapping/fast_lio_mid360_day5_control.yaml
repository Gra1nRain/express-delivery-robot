/**:
  ros__parameters:
    feature_extract_enable: false
    point_filter_num: 10
    max_iteration: 3
    filter_size_surf: 0.5
    filter_size_map: 0.5
    cube_side_length: 1000.0
    runtime_pos_log_enable: false
    map_file_path: "/home/agilex/competition_ws/maps/debug/day1_fast_lio.pcd"

    common:
      lid_topic: "/livox/lidar"
      imu_topic: "/livox/imu"
      time_sync_en: false
      time_offset_lidar_to_imu: 0.0

    preprocess:
      lidar_type: 1
      scan_line: 4
      blind: 0.2
      timestamp_unit: 3
      scan_rate: 10

    mapping:
      # Keep the patched mapping timer above the 10 Hz LiDAR and 200 Hz IMU
      # callbacks so processing does not fall behind the sensor stream.
      timer_hz: 100
      acc_cov: 0.1
      gyr_cov: 0.1
      b_acc_cov: 0.0001
      b_gyr_cov: 0.0001
      fov_degree: 360.0
      det_range: 100.0
      extrinsic_est_en: false
      extrinsic_T: [-0.011, -0.02329, 0.04412]
      extrinsic_R: [1., 0., 0., 0., 1., 0., 0., 0., 1.]

    publish:
      path_en: false
      effect_map_en: false
      map_en: false
      # The patched body-cloud publisher is independent of the expensive
      # world-frame cloud and can reuse the existing downsampled scan.
      scan_publish_en: false
      dense_publish_en: false
      scan_bodyframe_pub_en: true

    pcd_save:
      pcd_save_en: false
      interval: -1
