/**:
  ros__parameters:
    feature_extract_enable: false
    # 2026-07-27 static-avoidance A/B on the Jetson: 5 reduced FAST-LIO to
    # about 0.78 Hz / 1.4 s delay, while 10 sustained about 9.98 Hz with
    # 0.037 s mean and 0.061 s maximum odometry delay.
    point_filter_num: 10
    max_iteration: 3
    filter_size_surf: 0.5
    filter_size_map: 0.5
    cube_side_length: 1000.0
    runtime_pos_log_enable: false
    map_file_path: "/home/agilex/competition_ws/maps/debug/day1_fast_lio.pcd"

    common:
      lid_topic: "/livox/lidar"
      imu_topic: "/livox/imu"
      time_sync_en: false
      time_offset_lidar_to_imu: 0.0

    preprocess:
      lidar_type: 1
      scan_line: 4
      blind: 0.5
      timestamp_unit: 3
      scan_rate: 10

    mapping:
      # Keep the mapping timer above the sensor rates. FAST-LIO uses a
      # single-threaded executor; a 10 Hz timer is starved by LiDAR/IMU
      # callbacks after map initialization and drops output below 1 Hz.
      timer_hz: 100
      acc_cov: 0.1
      gyr_cov: 0.1
      b_acc_cov: 0.0001
      b_gyr_cov: 0.0001
      fov_degree: 360.0
      det_range: 100.0
      extrinsic_est_en: false
      extrinsic_T: [-0.011, -0.02329, 0.04412]
      extrinsic_R: [1., 0., 0., 0., 1., 0., 0., 0., 1.]

    publish:
      path_en: false
      effect_map_en: false
      map_en: false
      # /cloud_registered performs a full world-frame conversion and was
      # measured to throttle FAST-LIO from about 10 Hz to about 0.7 Hz.
      # The patched publisher keeps the body cloud independent of this switch.
      scan_publish_en: false
      dense_publish_en: false
      scan_bodyframe_pub_en: true

    pcd_save:
      pcd_save_en: false
      interval: -1
