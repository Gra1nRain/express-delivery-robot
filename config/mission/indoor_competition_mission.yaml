mission:
  refs:
    traffic_marker: traffic_light_vision_on
    traffic_stop: traffic_light_stop_line
    pickup_front: pickup_front
    pickup_rear: pickup_rear
    drop_front: drop_front
    drop_rear: drop_rear
    finish: finish_park
  traffic:
    # Starts only after ARRIVED_AND_STOPPED. Red/yellow samples reset it.
    no_result_timeout_s: 15.0
  arm:
    # Start both pickup YOLO stages only after traffic recognition releases.
    # Hold at the traffic stop until both GPU YOLO stages report ready; this
    # timeout preserves the mission's no-deadlock recovery policy.
    vision_preload_timeout_s: 30.0
    # The integrated arm can spend more than 120 s across instruction recognition,
    # observation scans, grasping, and the return-to-transit move. Keep a hard deadline,
    # but do not cancel a physically successful pickup while it is returning.
    pickup:
      max_attempts: 1
      total_timeout_s: 180.0
      # These two recovery transitions are explicit competition policy. The
      # state-machine defaults stop at PICKUP_FAILED when they are absent.
      allow_rear_fallback: true
      allow_skip_after_failure: true
    drop:
      max_attempts: 1
      total_timeout_s: 90.0
