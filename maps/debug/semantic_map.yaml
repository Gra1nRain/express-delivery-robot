schema_version: semantic_map_v1
status: draft
profile: debug
frame_id: map
source_map: maps/debug/map.yaml
coordinate_source: >-
  Initial draft points were projected from recordings/day1/map_preview.png.
  Measured debug points were captured on the car from AMCL/TF in the map frame
  during supervised low-speed manual marking, then route-reviewed with
  FAST-LIO anchored from traffic_light_stop_line. On 2026-07-21, all
  coordinate-bearing debug semantic geometry was aligned to the RViz occupancy
  map with a 3-anchor SE(2) calibration from /clicked_point anchors start,
  traffic_light_stop_line, and random_obstacle_entry. On 2026-07-22, current
  debug semantic points were re-measured by driving the car to each semantic
  pose and sampling FAST-LIO map->body after RViz map/scan alignment.
coordinate_convention:
  position_unit: m
  heading_unit: rad
  polygon_winding: counter_clockwise
  map_origin: [-2.39, -18.30, 0.0]
  map_resolution: 0.03
alignment_calibration:
  method: fast_lio_map_body_pose_sampling
  date: 2026-07-22
  tf_source: map_to_body
  anchor_source: rviz_2d_pose_estimate_at_start_then_static_map_to_camera_init_lock
  sampled_points:
    - start
    - traffic_light_stop_line
    - random_obstacle_entry
    - random_obstacle_exit
    - pickup_dock
    - cone_lane_change_entry
    - cone_lane_change_exit
    - drop_dock
    - finish_park
  supersedes: se2_least_squares_clicked_points_2026_07_21
verification:
  map_file_load: passed_car_nav2_map_server
  rviz_pose_check: passed_amcl_tf_pose_capture
  low_speed_route_check: passed_manual_low_speed_semantic_marking
  fastlio_route_review: passed_manual_low_speed_route_review
  rviz_clicked_point_alignment: passed_three_anchor_se2_calibration
  fastlio_pose_resample: passed_manual_body_pose_sampling_2026_07_22
  return_to_start_error_check: pending

# The effective area is intentionally narrower than the complete Day 1 map.
# It represents the laboratory debug region only; it is not the competition map.
effective_area:
  id: debug_effective_area
  type: polygon
  status: draft
  vertices:
    - [-3.11, -1.76]
    - [19.55, -11.07]
    - [23.73, -0.90]
    - [20.71, 3.59]
    - [15.62, 5.68]
    - [11.90, 4.51]
    - [8.20, 6.03]
    - [0.43, 6.84]

points:
  start:
    x: -0.376
    y: 0.112
    yaw: 0.020
    role: start_area
    status: measured
  traffic_light_stop_line:
    x: 2.215
    y: 0.222
    yaw: 0.045
    role: traffic_light_stop_line
    status: measured
  pickup_dock:
    x: 8.859
    y: -0.018
    yaw: -0.003
    role: pickup_area
    status: measured
  drop_dock:
    x: 2.077
    y: 3.370
    yaw: 3.108
    role: drop_area
    status: measured
  finish_park:
    x: -0.740
    y: 3.185
    yaw: 3.128
    role: finish_parking_area
    status: measured

  random_obstacle_entry:
    x: 3.720
    y: 0.320
    yaw: 0.020
    role: random_obstacle_zone_entry
    status: measured
  random_obstacle_exit:
    x: 6.679
    y: 0.295
    yaw: -0.016
    role: random_obstacle_zone_exit
    status: measured
  cone_lane_change_entry:
    x: 7.452
    y: 2.844
    yaw: 3.138
    role: cone_lane_change_zone_entry
    status: measured
  cone_lane_change_exit:
    x: 3.896
    y: 2.866
    yaw: -3.118
    role: cone_lane_change_zone_exit
    status: measured

lane_centerlines:
  - id: start_to_pickup_lane
    status: draft
    width_m: 2.40
    points:
      - start
      - traffic_light_stop_line
      - random_obstacle_entry
      - random_obstacle_exit
      - pickup_dock
  - id: pickup_to_drop_lane
    status: draft
    width_m: 2.40
    points:
      - pickup_dock
      - cone_lane_change_entry
      - cone_lane_change_exit
      - drop_dock
  - id: drop_to_pickup_lane
    status: draft
    width_m: 2.40
    points:
      - drop_dock
      - cone_lane_change_exit
      - cone_lane_change_entry
      - pickup_dock
  - id: lab_drop_to_pickup_lane
    status: debug_lab_only
    width_m: 2.40
    points:
      - drop_dock
      - traffic_light_stop_line
      - random_obstacle_entry
      - random_obstacle_exit
      - pickup_dock
  - id: drop_to_finish_lane
    status: draft
    width_m: 2.40
    points:
      - drop_dock
      - finish_park

lane_boundaries:
  - id: debug_outer_boundary
    status: draft
    points:
      - [-3.11, -1.76]
      - [19.55, -11.07]
      - [23.73, -0.90]
      - [20.71, 3.59]
      - [15.62, 5.68]
      - [11.90, 4.51]
      - [8.20, 6.03]
      - [0.43, 6.84]
      - [-3.11, -1.76]

stop_lines:
  - id: traffic_light_stop_line
    point_ref: traffic_light_stop_line
    status: measured
    length_m: 2.40
  - id: pickup_dock_stop_line
    point_ref: pickup_dock
    status: measured
    length_m: 2.40
  - id: drop_dock_stop_line
    point_ref: drop_dock
    status: measured
    length_m: 2.40

obstacle_zones:
  - id: random_obstacle_zone_1
    semantic_type: RANDOM_OBSTACLE
    status: derived_draft
    boundary:
      - [3.73, 1.52]
      - [6.69, 1.49]
      - [6.67, -0.90]
      - [3.71, -0.88]
  - id: cone_lane_change_zone
    semantic_type: CONE_LANE_CHANGE
    status: derived_draft
    boundary:
      - [7.45, 1.64]
      - [3.89, 1.67]
      - [3.90, 4.07]
      - [7.46, 4.04]

no_go_zones:
  - id: outside_debug_effective_area
    semantic_type: KEEP_OUT
    status: derived_draft
    geometry: outside_polygon
    boundary_ref: debug_effective_area
    reason: Do not plan outside the selected laboratory debug area.

dock_poses:
  - id: pickup_dock
    point_ref: pickup_dock
    dock_type: PICKUP
    work_side: RIGHT
    position_tolerance_m: 0.10
    yaw_tolerance_deg: 5.0
    status: measured
  - id: drop_dock
    point_ref: drop_dock
    dock_type: DROP
    work_side: RIGHT
    position_tolerance_m: 0.10
    yaw_tolerance_deg: 5.0
    status: measured
  - id: finish_park
    point_ref: finish_park
    dock_type: FINISH
    work_side: RIGHT
    position_tolerance_m: 0.10
    yaw_tolerance_deg: 5.0
    status: measured

route_corridors:
  - id: go_to_pickup
    centerline_ref: start_to_pickup_lane
    allowed_steps: [go_traffic_light_1, random_obstacle_1]
  - id: pickup_to_drop
    centerline_ref: pickup_to_drop_lane
    allowed_steps: [cone_lane_change_1, cone_lane_change_2]
  - id: return_to_pickup
    centerline_ref: drop_to_pickup_lane
    allowed_steps: [return_to_pickup_area]
  - id: lab_return_to_pickup
    centerline_ref: lab_drop_to_pickup_lane
    allowed_steps: [return_to_pickup_area]
  - id: finish_return
    centerline_ref: drop_to_finish_lane
    allowed_steps: [finish_park]
